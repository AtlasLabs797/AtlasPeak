name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      # secrets.properties no está en el repo; en CI se crea con placeholders
      # para que el build no falle (los valores reales no son necesarios para compilar).
      - name: Create placeholder secrets
        run: |
          echo "OAUTH_WEB_CLIENT_ID=ci-placeholder.apps.googleusercontent.com" > secrets.properties
          echo "MAPS_API_KEY=ci-placeholder" >> secrets.properties
      - name: Reject committed secrets
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files="$(git ls-files | grep -E '(^|/)(secrets\.properties|keystore\.properties|local\.properties|google-services\.json|\.env)$|\.(jks|keystore|p12|pfx|pem|key)$' || true)"
          if [ -n "$forbidden_files" ]; then
            echo "Forbidden secret-bearing files are tracked:"
            echo "$forbidden_files"
            exit 1
          fi

          if git grep -n -I -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9_-]{20,}' -- .; then
            echo "Potential high-confidence secret detected in tracked content."
            exit 1
          fi
      - name: Build debug
        run: ./gradlew assembleDebug
      - name: Unit tests
        run: ./gradlew test
      - name: Domain/data coverage
        run: ./gradlew jacocoDebugDomainDataCoverageVerification
      - name: Lint
        run: ./gradlew lint
