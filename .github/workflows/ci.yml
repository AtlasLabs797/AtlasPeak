name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      # secrets.properties no está en el repo; en CI se crea con placeholders
      # para que el build no falle (los valores reales no son necesarios para compilar).
      - name: Create placeholder secrets
        run: |
          echo "OAUTH_WEB_CLIENT_ID=ci-placeholder.apps.googleusercontent.com" > secrets.properties
          echo "MAPS_API_KEY=ci-placeholder" >> secrets.properties
      - name: Build debug
        run: ./gradlew assembleDebug
      - name: Unit tests
        run: ./gradlew test
      - name: Domain/data coverage
        run: ./gradlew jacocoDebugDomainDataCoverageVerification
      - name: Lint
        run: ./gradlew lint
