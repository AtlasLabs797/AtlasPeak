name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      # secrets.properties no está en el repo; en CI se crea con placeholders
      # para que el build no falle (los valores reales no son necesarios para compilar).
      - name: Create placeholder secrets
        run: |
          echo "OAUTH_WEB_CLIENT_ID=ci-placeholder.apps.googleusercontent.com" > secrets.properties
          echo "MAPS_API_KEY=ci-placeholder" >> secrets.properties
      - name: Build debug
        run: ./gradlew assembleDebug
      - name: Unit tests
        run: ./gradlew test
      - name: Lint
        run: ./gradlew lint
